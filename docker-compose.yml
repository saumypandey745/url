version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sec_platform_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: secplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sec_platform_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sec_platform_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/secplatform?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production-secret-jwt-key-replace-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: sec_platform_worker
    restart: always
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/secplatform?schema=public
      - REDIS_URL=redis://redis:6379
      - BLOCK_PRIVATE_NETWORKS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sec_platform_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
