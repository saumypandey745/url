services:
  # 1. Express API Backend Server
  - type: web
    name: secplatform-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm --prefix apps/api run start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: secplatform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: secplatform-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BLOCK_PRIVATE_NETWORKS
        value: "true"

  # 2. BullMQ Scanner Worker Service
  - type: worker
    name: secplatform-worker
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm --prefix apps/worker run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: secplatform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: secplatform-redis
          property: connectionString
      - key: BLOCK_PRIVATE_NETWORKS
        value: "true"

  # 3. React SOC Dark-Mode Static Site
  - type: web
    name: secplatform-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 4. Redis Key-Value Store
  - type: redis
    name: secplatform-redis
    region: singapore
    plan: free
    ipAllowList: []

databases:
  # 5. PostgreSQL Database
  - name: secplatform-db
    databaseName: secplatform
    user: secplatform
    region: singapore
    plan: free
